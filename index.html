  <style>
    body{font-family:-apple-system,'Segoe UI',sans-serif;font-size:12px;color:#1a1a18;max-width:1100px;margin:0 auto;padding:32px}
    h1{font-size:20px;margin-bottom:4px}
    h2{font-size:15px;margin:28px 0 10px;border-bottom:2px solid #1a1a18;padding-bottom:4px}
    h3{font-size:13px;margin:16px 0 6px;color:#444}
    .meta{color:#666;font-size:11px;margin-bottom:20px}
    .params{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 20px;margin-bottom:10px}
    .param{font-size:11px}
    .param b{display:block;color:#888;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.03em}
    table.rec-plate{border-collapse:collapse;font-size:9px;margin-bottom:16px}
    table.rec-plate th,table.rec-plate td{border:1px solid #ccc;padding:3px 5px;text-align:center;min-width:34px}
    table.rec-plate th{background:#f0f0ee;font-weight:600}
    table.rec-sub{border-collapse:collapse;font-size:10px;width:100%;margin-bottom:16px}
    table.rec-sub th,table.rec-sub td{border:1px solid #ddd;padding:3px 6px;text-align:left}
    table.rec-sub th{background:#f0f0ee}
    .plate-block{margin-bottom:24px}
    .tag-list-print{font-size:11px;color:#444;margin-bottom:6px}
    @media print{ body{padding:10px} .no-print{display:none} }
    .print-btn{position:fixed;top:16px;right:16px;padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px}
  </style></head><body>
  <button class="print-btn no-print" onclick="window.print()">🖨 Print / Save as PDF</button>
  <h1>Fermentation &amp; LCMS Experiment Record</h1>
  <div class="meta">Generated: ${ts} &nbsp;|&nbsp; Run date: ${S.date} &nbsp;|&nbsp; Column: ${S.col} &nbsp;|&nbsp; Modes: ${modesStr}</div>

  <h2>1. Experiment parameters</h2>
  <div class="params">
    <div class="param"><b>Donors</b>${donors.join(', ')||'—'}</div>
    <div class="param"><b>PBS abiotic control</b>${S.hasPBS?'Yes':'No'}</div>
    <div class="param"><b>DMSO vehicle control</b>${S.hasDmsoCtrl?'Yes':'No'}</div>
    <div class="param"><b>Timepoints</b>${timepoints.map(t=>t+'h').join(', ')||'—'}</div>
    <div class="param"><b>Blank/QC interval</b>${S.qcInterval} samples</div>
    <div class="param"><b>Pre-blanks / Post-blanks</b>${S.preBlanks} / ${S.postBlanks}</div>
    <div class="param"><b>Blank vial position</b>${S.blankPos}</div>
    <div class="param"><b>QC vial position</b>${S.qcPos}</div>
    <div class="param"><b>Vial holder slot</b>${S.vhColor}</div>
    <div class="param"><b>First LCMS plate color</b>${S.plateColor}</div>
    <div class="param"><b>Available LCMS colors</b>${availableLcmsColors().join(', ')}</div>
    <div class="param"><b>Shutdown injection</b>${S.hasShutdown?'Yes (from blank vial)':'No'}</div>
    <div class="param"><b>Calibration replicates</b>${S.calReps} (technical)</div>
    <div class="param"><b>Calibration strategy</b>${S.calStrat==='per-tp'?'Before each timepoint':'Once at start'}</div>
    <div class="param"><b>Calibration location</b>${S.calLoc==='vial'?'Vial holder':'LCMS plate wells'}</div>
    <div class="param"><b>Calibration concentrations</b>${S.calConcs.join(', ')}</div>
  </div>

  <h3>Compounds</h3>
  <div class="tag-list-print">${compounds.map(c=>`${c.abbr}${c.name?' ('+c.name+')':''} [${c.type}, stock ${c.stockConc||10} ${c.stockUnit||'mM'}]`).join(' &nbsp;·&nbsp; ')}</div>

  <h2>2. Deepwell plates</h2>`;

  dwPlates.forEach((p,i)=>{
    const rowLabels=R8, colLabels=Array.from({length:12},(_,c)=>c+1);
    html+=`<div class="plate-block"><h3>Deepwell plate ${i+1} — ${(p.rowGroups||[]).map(g=>g.donor==='PBS'?'PBS':'Donor '+g.donor).join(' + ')}</h3>
    ${plateToTable(p.grid,8,12,rowLabels,colLabels)}</div>`;
  });

  html+=`<h2>3. Collect plates</h2>`;
  cpPlates.forEach((p,i)=>{
    const label=p.isBalance?'Balance plate':`Collect plate ${i+1}${p.tp!=null?' ('+p.tp+'h)':''}`;
    html+=`<div class="plate-block"><h3>${label}</h3>
    ${plateToTable(p.grid,8,12,R8,Array.from({length:12},(_,c)=>c+1))}</div>`;
  });

  html+=`<h2>4. LCMS plate layout</h2>
  <h3>Vial holder (${S.vhColor}:)</h3>
  ${plateToTable(vialHolder,6,9,R6,Array.from({length:9},(_,c)=>c+1))}`;
  lcmsPlates.forEach((lp,i)=>{
    html+=`<div class="plate-block"><h3>LCMS plate ${i+1} [${lp.color}]</h3>
    ${plateToTable(lp.grid,8,12,R8,Array.from({length:12},(_,c)=>c+1))}</div>`;
  });

  html+=`<h2>5. Submission file</h2>`;
  const displayRows=buildDisplayRows();
  html+=`<table class="rec-sub"><thead><tr><th>#</th><th>File name</th><th>Mode</th><th>Position</th><th>Type</th><th>Method</th></tr></thead><tbody>`;
  displayRows.forEach((r,idx)=>{
    html+=`<tr><td>${idx+1}</td><td style="font-family:monospace;font-size:9px">${r.fname}</td><td>${r.mode||''}</td><td style="font-family:monospace">${r.position}</td><td>${r.type}</td><td style="font-size:9px">${r.method||''}</td></tr>`;
  });
  html+=`</tbody></table>
  <div class="meta" style="margin-top:30px">— End of record — generated by LCMS Planner on ${ts} —</div>
  </body></html>`;

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(!w){
    // popup blocked — fall back to download
    const a=document.createElement('a');
    a.href=url;
    a.download=`experiment_record_${S.date}_${ts.replace(/[: ]/g,'-')}.html`;
    a.click();
    flashToast('Popup blocked — downloaded record instead');
  }
}

function renderMain(view,preserveScroll){
  const scrollY=window.scrollY;
  if(view==='setup') renderSetup();
  else if(view==='dw') renderDwView();
  else if(view==='cp') renderCpView();
  else if(view==='lp') renderLpView();
  else if(view==='sub') renderSubView();
  if(preserveScroll) window.scrollTo(0,scrollY);
  updateToolbar();
  updateUndoButtons();
  updateProgress();
  syncFocusDOM();
  scheduleSave();
}

/* =====================================================================
   SIDEBAR TOGGLE, WELL ZOOM & PROGRESS BAR
   ===================================================================== */
function toggleSidebar(){
  sidebarCollapsed=!sidebarCollapsed;
  applySidebarState();
  try{localStorage.setItem('lcms_sidebar_collapsed',sidebarCollapsed?'1':'0');}catch(err){}
}
function applySidebarState(){
  const root=document.getElementById('app-root');
  if(root) root.classList.toggle('sb-collapsed',sidebarCollapsed);
  const btn=document.getElementById('sb-toggle');
  if(btn) btn.textContent=sidebarCollapsed?'▸':'◂';
}
function applyZoom(){
  document.documentElement.style.setProperty('--well-scale',wellZoom.toFixed(2));
  const el=document.getElementById('zoom-pct');
  if(el) el.textContent=Math.round(wellZoom*100)+'%';
}
function adjustZoom(delta){
  wellZoom=Math.min(1.6,Math.max(0.6,+(wellZoom+delta).toFixed(2)));
  applyZoom();
  try{localStorage.setItem('lcms_well_zoom',wellZoom);}catch(err){}
}
function updateProgress(){
  const fill=document.getElementById('progress-fill');
  if(!fill) return;
  const done=document.querySelectorAll('.nav-item.done').length;
  fill.style.width=(done/5*100)+'%';
}

/* =====================================================================
   TOUCH SUPPORT — mirrors the mouse drag-select / move-mode flow so
   plate grids are selectable and movable on tablets/touchscreens.
   Double-tap the same well within 400ms opens its editor.
   ===================================================================== */
let lastTap=null;
function wellTouchStart(e,kind,idx,r,c){
  if(e.touches&&e.touches.length>1) return; // ignore pinch/multi-touch
  const now=Date.now();
  if(lastTap&&lastTap.kind===kind&&lastTap.idx===idx&&lastTap.r===r&&lastTap.c===c&&(now-lastTap.time)<400){
    lastTap=null;
    e.preventDefault();
    const evt=wellEditorEvent(kind,idx,r,c);
    if(evt){ if(kind==='vh') openVHEditor(evt,r,c); else openCellEditor(evt,kind,idx,r,c); }
    return;
  }
  lastTap={kind,idx,r,c,time:now};
  e.preventDefault(); // stop the page from scrolling while selecting/moving
  startDrag(e,kind,idx,r,c);
  window.addEventListener('touchmove',touchDragMove,{passive:false});
  window.addEventListener('touchend',touchDragEnd,{once:true});
}
function touchDragMove(e){
  if(!e.touches||e.touches.length!==1) return;
  e.preventDefault();
  const t=e.touches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const wellEl=el&&el.closest?el.closest('.well'):null;
  if(!wellEl) return;
  const container=wellEl.closest('[data-kind]');
  if(!container) return;
  const kind=container.dataset.kind,idx=parseInt(container.dataset.idx);
  const r=parseInt(wellEl.dataset.r),c=parseInt(wellEl.dataset.c);
  dragOver(null,kind,idx,r,c);
}
function touchDragEnd(){
  window.removeEventListener('touchmove',touchDragMove);
  if(moveMode) endMoveDrag(); else endDrag();
}

/* =====================================================================
   AUTOSAVE / RESTORE — debounced snapshot of all editable state to
   localStorage so an accidental reload doesn't lose an in-progress plate
   layout. Setup-list edits (donors/compounds/timepoints) persist too;
   in-flight setup form field values are not captured until Generate.
   ===================================================================== */
const SAVE_KEY='lcms_planner_v19_autosave';
let saveTimer=null;
function fullSnapshotForSave(){
  return{
    v:1,
    donors,compounds,timepoints,S,
    dwPlates,cpPlates,lcmsPlates,vialHolder,
    nextDwId,nextCpId,nextLpId,
    subOverrides,subDeletedBaseRows:Array.from(subDeletedBaseRows),subInsertedRows,
    lastView:currentNavView()
  };
}
function currentNavView(){
  const a=document.querySelector('.nav-item.active');
  return a?a.id.replace('nav-',''):'setup';
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(SAVE_KEY,JSON.stringify(fullSnapshotForSave())); }catch(err){}
  },600);
}
function tryLoadSavedState(){
  let raw;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(err){ return null; }
  if(!raw) return null;
  try{
    const data=JSON.parse(raw);
    return data&&data.v?data:null;
  }catch(err){ return null; }
}
function applyRestoredState(data){
  donors=data.donors||[];compounds=data.compounds||[];timepoints=data.timepoints||[];
  S=data.S||null;
  dwPlates=data.dwPlates||[];cpPlates=data.cpPlates||[];lcmsPlates=data.lcmsPlates||[];
  vialHolder=data.vialHolder&&data.vialHolder.length?data.vialHolder:emptyVH();
  nextDwId=data.nextDwId||1;nextCpId=data.nextCpId||1;nextLpId=data.nextLpId||1;
  subOverrides=data.subOverrides||{};
  subDeletedBaseRows=new Set(data.subDeletedBaseRows||[]);
  subInsertedRows=data.subInsertedRows||[];
  if(S&&dwPlates.length){
    ['dw','cp','lp','sub'].forEach(n=>{const el=document.getElementById('nav-'+n);if(el) el.classList.add('done');});
  }
}

// init
let sidebarCollapsed=false;
let wellZoom=1;
try{ sidebarCollapsed=localStorage.getItem('lcms_sidebar_collapsed')==='1'; }catch(err){}
try{ const z=parseFloat(localStorage.getItem('lcms_well_zoom')); if(!isNaN(z)) wellZoom=z; }catch(err){}
applySidebarState();
applyZoom();

const savedState=tryLoadSavedState();
let startView='setup';
if(savedState&&((savedState.donors&&savedState.donors.length)||(savedState.dwPlates&&savedState.dwPlates.length))){
  if(confirm('偵測到上次未儲存的工作階段,是否要恢復?(取消將載入示範資料並清除已儲存的暫存)')){
    applyRestoredState(savedState);
    startView=savedState.lastView||'setup';
  } else {
    try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
    loadDemo();
  }
} else {
  loadDemo();
}
document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
const startNav=document.getElementById('nav-'+startView);
if(startNav) startNav.classList.add('active'); else document.getElementById('nav-setup').classList.add('active');
renderMain(startView);

</script>
</body>
</html>
